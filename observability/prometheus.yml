global:
  scrape_interval: 10s
scrape_configs:
  - job_name: kafka-explorer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["explorer:8080"]
  - job_name: kex-agent
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["agent:8081"]
  - job_name: autotune
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["autotune:8080"]
