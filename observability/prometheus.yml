global:
  scrape_interval: 10s
scrape_configs:
  - job_name: kafka-explorer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["explorer:8080"]
  - job_name: kex-agent
    authorization:
      type: Bearer
      credentials_file: /run/secrets/kex-agent-metrics-token
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["agent:8081"]
  - job_name: autotune
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["autotune:8080"]
  - job_name: lab-metrics
    static_configs:
      - targets: ["lab-metrics:9108"]
