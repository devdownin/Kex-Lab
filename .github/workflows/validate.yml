name: Validate Lab

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          EXPLORER_MCP_AUTH_TOKEN: ci-mcp-token
          KEX_AGENT_API_KEY: ci-agent-key
        run: |
          docker compose --env-file versions.env -f compose.yml config -q
          docker compose --env-file versions.env -f compose.yml -f compose.autotune.yml config -q
          docker compose --env-file versions.env -f compose.yml -f compose.autotune.yml -f compose.observability.yml config -q
      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh; do
            sh -n "$script"
          done
