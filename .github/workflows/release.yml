name: Release Kex Lab

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed main history and version
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          fi
      - name: Validate repository
        run: make check
      - name: Validate Kafka integration
        run: make integration-smoke
      - name: Validate observability
        run: make observability-smoke
      - name: Build exact-commit release assets
        run: |
          python3 scripts/prepare-release.py --output dist
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: kex-lab-release-bundle
          path: dist/
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Kex Lab $GITHUB_REF_NAME" --notes-file dist/release-notes.md dist/kex-lab-*.tar.gz dist/versions.env dist/bundle.json dist/SHA256SUMS
