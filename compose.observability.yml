services:
  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/kafka-init.sh:/opt/kex-lab/kafka-init.sh:ro
    entrypoint: ["sh", "/opt/kex-lab/kafka-init.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEX_LAB_TOPIC: ${KEX_LAB_TOPIC:-demo.app.topic}
      KEX_LAB_DLT_TOPIC: ${KEX_LAB_DLT_TOPIC:-demo.app.topic.dlt}
      KEX_LAB_PARTITIONS: ${KEX_LAB_PARTITIONS:-6}
      KEX_LAB_MESSAGES: ${KEX_LAB_MESSAGES:-500}
    restart: "no"

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.1}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-kex-lab}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    restart: unless-stopped
